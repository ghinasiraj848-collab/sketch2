<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOHA SHOP</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#0b0b0b;
  color:#fff;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:#0b0b0b;
  border-bottom:1px solid #292929;
  padding:18px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  color:#d4af37;
  font-size:25px;
  font-weight:bold;
  letter-spacing:2px;
}

header a{
  color:white;
  text-decoration:none;
  margin-left:20px;
}

.hero{
  min-height:430px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:50px 20px;
  background:
    linear-gradient(#0009,#0009),
    url("https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=1600&q=80")
    center/cover;
}

.hero h1{
  font-size:48px;
  color:#d4af37;
  margin-bottom:15px;
}

.hero p{
  font-size:18px;
  color:#ddd;
}

.btn{
  border:0;
  background:#d4af37;
  color:#111;
  padding:13px 22px;
  border-radius:6px;
  font-weight:bold;
  cursor:pointer;
  margin-top:20px;
}

.section{
  padding:55px 6%;
}

.section-title{
  text-align:center;
  color:#d4af37;
  font-size:30px;
  margin-bottom:35px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:25px;
}

.card{
  background:#151515;
  border:1px solid #292929;
  border-radius:12px;
  overflow:hidden;
  transition:.3s;
}

.card:hover{
  transform:translateY(-5px);
  border-color:#d4af37;
}

.card img{
  width:100%;
  height:280px;
  object-fit:cover;
}

.card-content{
  padding:18px;
}

.card h3{
  margin-bottom:10px;
}

.price{
  color:#d4af37;
  font-size:20px;
  font-weight:bold;
}

.whatsapp{
  display:block;
  text-align:center;
  text-decoration:none;
  background:#25d366;
  color:white;
  padding:11px;
  border-radius:6px;
  margin-top:15px;
}

footer{
  text-align:center;
  padding:35px 15px;
  border-top:1px solid #292929;
  color:#888;
  font-size:13px;
}

.admin-link{
  color:#555;
  text-decoration:none;
  font-size:11px;
  margin-left:8px;
}

.admin-link:hover{
  color:#d4af37;
}

/* LOGIN */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#000c;
  z-index:100;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal-box{
  width:100%;
  max-width:400px;
  background:#151515;
  border:1px solid #d4af37;
  border-radius:12px;
  padding:30px;
}

.modal-box h2{
  color:#d4af37;
  margin-bottom:20px;
  text-align:center;
}

input{
  width:100%;
  padding:13px;
  margin:8px 0;
  border:1px solid #444;
  border-radius:6px;
  background:#0d0d0d;
  color:white;
}

.close{
  float:right;
  cursor:pointer;
  color:#aaa;
}

/* ADMIN */

#adminPage{
  display:none;
  min-height:100vh;
  background:#101010;
  padding:30px 6%;
}

.admin-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
  gap:15px;
  flex-wrap:wrap;
}

.admin-header h1{
  color:#d4af37;
}

.dashboard{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
  margin-bottom:30px;
}

.stat{
  background:#181818;
  border:1px solid #292929;
  padding:22px;
  border-radius:10px;
}

.stat span{
  display:block;
  color:#999;
  margin-bottom:8px;
}

.stat strong{
  font-size:27px;
  color:#d4af37;
}

.admin-panel{
  background:#181818;
  border:1px solid #292929;
  border-radius:10px;
  padding:25px;
}

.admin-panel h2{
  color:#d4af37;
  margin-bottom:15px;
}

.admin-product{
  display:flex;
  align-items:center;
  gap:15px;
  padding:12px 0;
  border-bottom:1px solid #292929;
}

.admin-product img{
  width:65px;
  height:65px;
  object-fit:cover;
  border-radius:7px;
}

.admin-product-info{
  flex:1;
}

.action{
  padding:8px 12px;
  border:0;
  border-radius:5px;
  cursor:pointer;
  margin:2px;
}

.edit{
  background:#d4af37;
}

.delete{
  background:#b52b2b;
  color:white;
}

.logout{
  background:#333;
  color:white;
  padding:10px 16px;
  border:0;
  border-radius:6px;
  cursor:pointer;
}

@media(max-width:600px){
  .hero h1{
    font-size:35px;
  }

  header{
    padding:15px 4%;
  }

  header a{
    margin-left:8px;
    font-size:13px;
  }

  .section{
    padding:40px 4%;
  }
}
</style>
</head>

<body>

<!-- ================= STORE ================= -->

<div id="storePage">

<header>
  <div class="logo">MOHA SHOP</div>

  <nav>
    <a href="#home">Accueil</a>
    <a href="#products">Produits</a>
  </nav>
</header>

<section class="hero" id="home">
  <div>
    <h1>MOHA SHOP</h1>
    <p>Découvrez notre collection avec style.</p>
    <a href="#products">
      <button class="btn">Découvrir la collection</button>
    </a>
  </div>
</section>

<section class="section" id="products">
  <h2 class="section-title">Notre Collection</h2>

  <div class="products" id="productsContainer"></div>
</section>

<footer>
  © 2026 MOHA SHOP — Tous droits réservés.

  <a href="#" class="admin-link" onclick="openLogin()">
    Admin
  </a>
</footer>

</div>


<!-- ================= LOGIN ================= -->

<div class="modal" id="loginModal">

  <div class="modal-box">

    <span class="close" onclick="closeLogin()">✕</span>

    <h2>Admin Login</h2>

    <input
      type="text"
      id="username"
      placeholder="Nom d'utilisateur"
    >

    <input
      type="password"
      id="password"
      placeholder="Mot de passe"
    >

    <button class="btn" onclick="login()">
      Se connecter
    </button>

    <p id="loginError"
       style="color:#ff5555;margin-top:15px;text-align:center;">
    </p>

  </div>

</div>


<!-- ================= ADMIN ================= -->

<div id="adminPage">

  <div class="admin-header">

    <h1>⚙️ Admin Dashboard</h1>

    <button class="logout" onclick="logout()">
      Déconnexion
    </button>

  </div>

  <div class="dashboard">

    <div class="stat">
      <span>Produits</span>
      <strong id="productCount">0</strong>
    </div>

    <div class="stat">
      <span>Prix moyen</span>
      <strong id="averagePrice">0 DH</strong>
    </div>

  </div>


  <div class="admin-panel">

    <h2>➕ Ajouter un produit</h2>

    <input id="newName" placeholder="Nom du produit">

    <input id="newPrice" type="number" placeholder="Prix en DH">

    <input id="newImage" placeholder="Lien de l'image">

    <button class="btn" onclick="addProduct()">
      Ajouter le produit
    </button>

  </div>


  <br>


  <div class="admin-panel">

    <h2>📦 Gestion des produits</h2>

    <div id="adminProducts"></div>

  </div>

</div>


<script>

/* ================= DATA ================= */

let products = JSON.parse(localStorage.getItem("mohaProducts")) || [

  {
    name:"Produit Premium",
    price:299,
    image:"https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=800&q=80"
  },

  {
    name:"Collection Gold",
    price:399,
    image:"https://images.unsplash.com/photo-1496747611176-843222e1e57c?auto=format&fit=crop&w=800&q=80"
  },

  {
    name:"Style Élégant",
    price:249,
    image:"https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=800&q=80"
  }

];


/* ================= STORE ================= */

function saveProducts(){

  localStorage.setItem(
    "mohaProducts",
    JSON.stringify(products)
  );

}


function displayProducts(){

  const container =
    document.getElementById("productsContainer");

  container.innerHTML="";

  products.forEach((product,index)=>{

    container.innerHTML += `

      <div class="card">

        <img src="${product.image}"
             alt="${product.name}">

        <div class="card-content">

          <h3>${product.name}</h3>

          <div class="price">
            ${product.price} DH
          </div>

          <a
            class="whatsapp"
            href="https://wa.me/?text=Bonjour, je veux commander : ${encodeURIComponent(product.name)}"
            target="_blank">
            Commander sur WhatsApp
          </a>

        </div>

      </div>

    `;

  });

}


/* ================= LOGIN ================= */

function openLogin(){

  document.getElementById("loginModal").style.display="flex";

}


function closeLogin(){

  document.getElementById("loginModal").style.display="none";

}


function login(){

  const username =
    document.getElementById("username").value;

  const password =
    document.getElementById("password").value;


  /*
    DEMO LOGIN

    Username: admin
    Password: 1234
  */

  if(username==="admin" && password==="1234"){

    closeLogin();

    document.getElementById("storePage").style.display="none";

    document.getElementById("adminPage").style.display="block";

    displayAdmin();

  }else{

    document.getElementById("loginError").innerText =
      "Nom d'utilisateur ou mot de passe incorrect.";

  }

}


/* ================= ADMIN ================= */

function displayAdmin(){

  const container =
    document.getElementById("adminProducts");

  container.innerHTML="";

  products.forEach((product,index)=>{

    container.innerHTML += `

      <div class="admin-product">

        <img src="${product.image}">

        <div class="admin-product-info">

          <strong>${product.name}</strong>

          <div style="color:#d4af37">
            ${product.price} DH
          </div>

        </div>

        <button
          class="action edit"
          onclick="editProduct(${index})">
          ✏️
        </button>

        <button
          class="action delete"
          onclick="deleteProduct(${index})">
          🗑️
        </button>

      </div>

    `;

  });


  document.getElementById("productCount").innerText =
    products.length;


  let total=0;

  products.forEach(p=>{
    total += Number(p.price);
  });


  let average =
    products.length
    ? Math.round(total/products.length)
    : 0;


  document.getElementById("averagePrice").innerText =
    average+" DH";

}


/* ================= ADD ================= */

function addProduct(){

  const name =
    document.getElementById("newName").value.trim();

  const price =
    document.getElementById("newPrice").value;

  const image =
    document.getElementById("newImage").value.trim();


  if(!name || !price || !image){

    alert("عمر جميع الخانات.");

    return;

  }


  products.push({

    name:name,

    price:Number(price),

    image:image

  });


  saveProducts();

  displayProducts();

  displayAdmin();


  document.getElementById("newName").value="";
  document.getElementById("newPrice").value="";
  document.getElementById("newImage").value="";

}


/* ================= DELETE ================= */

function deleteProduct(index){

  if(confirm("واش متأكد بغيتي تحيد هاد المنتوج؟")){

    products.splice(index,1);

    saveProducts();

    displayProducts();

    displayAdmin();

  }

}


/* ================= EDIT ================= */

function editProduct(index){

  const newName =
    prompt(
      "اسم المنتج:",
      products[index].name
    );


  if(newName===null) return;


  const newPrice =
    prompt(
      "الثمن:",
      products[index].price
    );


  if(newPrice===null) return;


  const newImage =
    prompt(
      "رابط الصورة:",
      products[index].image
    );


  if(newImage===null) return;


  products[index].name=newName;

  products[index].price=Number(newPrice);

  products[index].image=newImage;


  saveProducts();

  displayProducts();

  displayAdmin();

}


/* ================= LOGOUT ================= */

function logout(){

  document.getElementById("adminPage").style.display="none";

  document.getElementById("storePage").style.display="block";

}


/* ================= START ================= */

displayProducts();

</script>

</body>
</html>
